name: 'Lint Code'

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint_python:
    name: Lint Python Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install flake8
      - name: Print working directory
        run: pwd
      - name: Run Linter
        run: flake8 server --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=djangoenv,node_modules,build && echo "Linted all the python files successfully"

  lint_js:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with: { node-version: 18 }
      - name: Install JSHint
        run: npm install jshint --global
      - name: Run Linter
        run: echo '{"esversion":8,"node":true,"asi":true,"sub":true}' > ./server/database/.jshintrc && jshint ./server/database/app.js && echo "Linted all the js files successfully"
